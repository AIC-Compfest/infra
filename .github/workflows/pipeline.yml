name: pipeline

on:
  repository_dispatch:
    types: [service-updated]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate stack file
        env:
          APP_ENV: production
          AI_PORT: 8100
          BACKEND_PORT: 8080
          FRONTEND_PORT: 3000
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SCHEMA_VERSION: 0.1.0
          CONFIG_VERSION: 0.1.0
        run: |
          FILE="docker-stack.yml"
          if [ ! -f "$FILE" ]; then
            FILE="docker-compose.yml"
          fi
          docker compose -f "$FILE" config

  build-and-push:
    name: Build and Push
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push infra image if this repo contains a Dockerfile
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "Building repo image..."
            docker build -t ghcr.io/${{ github.repository_owner }}/infra:${{ github.sha }} .
            docker push ghcr.io/${{ github.repository_owner }}/infra:${{ github.sha }}
          else
            echo "No Dockerfile in this repo; deployment will use the images from the app repos."
          fi

      - name: Validate final stack config
        shell: bash
        env:
          APP_ENV: production
          AI_PORT: 8100
          BACKEND_PORT: 8080
          FRONTEND_PORT: 3000
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SCHEMA_VERSION: 0.1.0
          CONFIG_VERSION: 0.1.0
        run: |
          FILE="docker-stack.yml"
          if [ ! -f "$FILE" ]; then
            FILE="docker-compose.yml"
          fi
          docker compose -f "$FILE" config

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file for remote deploy
        shell: bash
        run: |
          cat > envfile <<EOF
          AI_SERVICE_TAG=${{ github.event.client_payload.ai_service_tag || 'latest' }}
          BACKEND_API_TAG=${{ github.event.client_payload.backend_api_tag || 'latest' }}
          FRONTEND_TAG=${{ github.event.client_payload.frontend_tag || 'latest' }}

          APP_ENV=production
          AI_PORT=8100
          BACKEND_PORT=8080
          FRONTEND_PORT=3000

          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

          AI_SERVICE_URL=http://ai-service:8100
          SCHEMA_VERSION=0.1.0
          CONFIG_VERSION=0.1.0
          EOF

      - name: Deploy docker stack to VPS
        uses: cssnr/stack-deploy-action@v1
        with:
          name: verflo
          file: docker-stack.yml
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: ./envfile