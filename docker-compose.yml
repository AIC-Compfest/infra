services:
  # 1. Python Document Understanding & OCR Service
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: aic-ai-service
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8100}:8100"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${AI_PORT:-8100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEMA_VERSION: ${SCHEMA_VERSION:-0.1.0}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aic_network

  # 2. Go BFF, Deterministic Pricing & Business Workflow Engine
  backend-api:
    build:
      context: ../backend-api
      dockerfile: Dockerfile
    container_name: aic-backend-api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${BACKEND_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be provided}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY must be provided}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be provided}
      AI_SERVICE_URL: http://ai-service:8100
      SCHEMA_VERSION: ${SCHEMA_VERSION:-0.1.0}
      CONFIG_VERSION: ${CONFIG_VERSION:-0.1.0}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-120}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aic_network

  # 3. Next.js Reviewer Workspace & Evidence Viewer
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be provided}
    container_name: aic-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be provided}
      BACKEND_API_URL: http://backend-api:8080
      NEXT_PUBLIC_SCHEMA_VERSION: ${SCHEMA_VERSION:-0.1.0}
    depends_on:
      - backend-api
    networks:
      - aic_network

networks:
  aic_network:
    driver: bridge
