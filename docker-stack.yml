services:
  traefik:
    image: traefik:v3.7
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=verflo_aic_network"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=deploy@verflo.id"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - mode: host
        protocol: tcp
        published: 80
        target: 80
      - mode: host
        protocol: tcp
        published: 443
        target: 443
      - target: 8080
        published: 8081
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aic_network
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  ai-service:
    image: ghcr.io/aic-compfest/ai-service:${AI_SERVICE_TAG:-latest}
    ports:
      - "${AI_PORT:-8100}:8100"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${AI_PORT:-8100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEMA_VERSION: ${SCHEMA_VERSION:-0.1.0}
    networks:
      - aic_network
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: any

  backend-api:
    image: ghcr.io/aic-compfest/backend-api:${BACKEND_API_TAG:-latest}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${BACKEND_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be provided}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY must be provided}
      AI_SERVICE_URL: http://ai-service:8100
      SCHEMA_VERSION: ${SCHEMA_VERSION:-0.1.0}
      CONFIG_VERSION: ${CONFIG_VERSION:-0.1.0}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-120}
    secrets:
      - SUPABASE_SERVICE_ROLE_KEY
      - JWT_SECRET
    depends_on:
      - ai-service
    networks:
      - aic_network
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: any

  frontend:
    image: ghcr.io/aic-compfest/frontend:${FRONTEND_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be provided}
      BACKEND_API_URL: http://backend-api:8080
      NEXT_PUBLIC_SCHEMA_VERSION: ${SCHEMA_VERSION:-0.1.0}
    networks:
      - aic_network
    depends_on:
      - backend-api
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=verflo_aic_network"
        - "traefik.http.services.web.loadbalancer.server.port=3000"
        - "traefik.http.routers.web.rule=Host(`verflo.id`)"
        - "traefik.http.routers.web.entrypoints=websecure"
        - "traefik.http.routers.web.tls=true"
        - "traefik.http.routers.web.tls.certresolver=myresolver"
      update_config:
        order: start-first
      restart_policy:
        condition: any

networks:
  aic_network:
    driver: overlay

volumes:
  letsencrypt:

secrets:
  SUPABASE_SERVICE_ROLE_KEY:
    external: true
  JWT_SECRET:
    external: true